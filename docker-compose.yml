x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://pipeline:changeme@postgres:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://pipeline:changeme@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    ENVIRONMENT: production
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: pipeline
    POSTGRES_PASSWORD: changeme
    POSTGRES_DB: warehouse
    PYTHONPATH: /opt/airflow/src
    _PIP_ADDITIONAL_REQUIREMENTS: "pydantic-settings==2.1.0 structlog==24.1.0 typer==0.9.0 rich==13.7.0"
  volumes: &airflow-common-volumes
    - ./dags:/opt/airflow/dags
    - ./configs:/opt/airflow/configs
    - ./data:/opt/airflow/data
    - ./scripts:/opt/airflow/scripts:ro
    - ./src:/opt/airflow/src
    - ./requirements.txt:/opt/airflow/requirements.txt:ro
    - airflow_logs:/opt/airflow/logs
  networks:
    - pipeline-network

services:
  # ==========================================
  # PostgreSQL - Data Warehouse & Airflow Metadata
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: pipeline-postgres
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: warehouse
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pipeline-network
    restart: unless-stopped

  # ==========================================
  # Redis - Airflow Celery Broker
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: pipeline-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pipeline-network
    restart: unless-stopped

  # ==========================================
  # Apache Airflow - Initialization
  # ==========================================
  airflow-init:
    <<: *airflow-common
    container_name: pipeline-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - >
        set -euo pipefail;
        python /opt/airflow/scripts/bootstrap_airflow_db.py;
        airflow db migrate;
        airflow users list | grep -q " airflow " ||
        airflow users create
        --username "airflow"
        --password "airflow"
        --firstname "Data"
        --lastname "Engineer"
        --role "Admin"
        --email "admin@local.dev";
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  # ==========================================
  # Apache Airflow - Webserver
  # ==========================================
  airflow-webserver:
    <<: *airflow-common
    container_name: pipeline-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ==========================================
  # Apache Airflow - Scheduler
  # ==========================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: pipeline-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ==========================================
  # Apache Airflow - Worker (Celery)
  # ==========================================
  airflow-worker:
    <<: *airflow-common
    container_name: pipeline-airflow-worker
    command: celery worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery --app airflow.executors.celery_executor.app inspect ping -d \"celery@$${HOSTNAME}\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ==========================================
  # Apache Airflow - Triggerer
  # ==========================================
  airflow-triggerer:
    <<: *airflow-common
    container_name: pipeline-airflow-triggerer
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  airflow_logs:

networks:
  pipeline-network:
    driver: bridge
