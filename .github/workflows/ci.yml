name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # Code Quality Checks
  # ==========================================
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter (ruff)
        run: ruff check src/ tests/

      - name: Run formatter check (ruff)
        run: ruff format --check src/ tests/

      - name: Run type checker (mypy)
        run: mypy src/

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ==========================================
  # Integration Tests with Docker
  # ==========================================
  integration-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Start services (Postgres + Redis)
        run: |
          docker-compose up -d postgres redis
          sleep 10
          docker-compose ps

      - name: Run integration tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: warehouse
        run: |
          pytest tests/ -v -m integration || echo "No integration tests yet"

      - name: Cleanup Docker
        run: docker-compose down -v

  # ==========================================
  # Pipeline Execution Test
  # ==========================================
  pipeline-dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Generate sample data
        run: |
          mkdir -p data/sources/erp
          python scripts/generate_sample_data.py

      - name: Validate pipeline configuration
        run: |
          pipeline validate --config configs/pipeline.yaml

      - name: Dry run pipeline
        run: |
          pipeline run --config configs/pipeline.yaml --dry-run

      - name: Run full pipeline
        run: |
          pipeline run --config configs/pipeline.yaml

      - name: Check lineage database
        run: |
          ls -la data/lineage.db || echo "Lineage DB not created"

  # ==========================================
  # Security Scan
  # ==========================================
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload security scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
